name: Deploy Atlas API to Modal

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11" 

      # ==========================================
      # THE FIX: Added joblib & forced python -m pip
      # ==========================================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install modal duckdb pandas fastapi pydantic slowapi xgboost scikit-learn scipy huggingface_hub joblib

      - name: Deploy to Modal Cloud
        run: modal deploy main.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          API_KEY: ${{ secrets.API_KEY }}
